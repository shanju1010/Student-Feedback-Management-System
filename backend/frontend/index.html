/* Institutional redesign — deliberately flat, document-led and restrained. */

:root{--ink:#172431;--navy:#132838;--teal:#284c5b;--teal-soft:#edf1f3;--bg:#f8f9fa;--line:#d4dbe0;--muted:#61717c;--white:#fff;--amber:#856221;--red:#9a3e3e;--radius:0}

body{background:#f8f9fa;color:var(--ink);font:14px/1.55 'Segoe UI',Arial,sans-serif}

.app{grid-template-columns:232px minmax(0,1fr)}

.side{background:#142b3b;padding:31px 0 20px;gap:32px;border-right:3px solid #a28b60}

.brand{padding:0 22px;gap:12px;align-items:flex-start}

.seal{height:38px;width:38px;border:1px solid #b6a47f;border-radius:0;font-size:15px;letter-spacing:.02em;color:#e9ddc4}

.brand b{font-family:Georgia,'Times New Roman',serif;font-size:17px;font-weight:500;line-height:1.15;letter-spacing:-.02em}

.brand small{font-size:10px;letter-spacing:.01em;line-height:1.4;color:#b8c8cf}

.navlabel{padding:0 22px;color:#9fb2be;font-size:10px;letter-spacing:.17em}

.nav{gap:0}.nav button{width:100%;border:0;border-left:3px solid transparent;border-radius:0;background:transparent;color:#d0dce3;padding:13px 20px;font-size:13px;font-weight:500;text-align:left;transition: background .12s;}

.nav button:hover{background:#223b4c;color:white}.nav button.active{background:#2a4454;color:#fff;border-left-color:#d5bd8a}

.nav .glyph{opacity:.72}.sidefoot{margin:0 20px;padding:16px 0;border:0;border-top:1px solid #48606d;border-radius:0;background:transparent;color:#a9bcc7;font-size:11px}.sidefoot strong{font-size:10px;letter-spacing:.12em;color:#e6d6b8}

.top{height:66px;background:#fff;border-bottom:1px solid var(--line);padding:0 42px}

.crumb{font-size:12px;color:#667783}.crumb b{color:#172b3a;font-weight:600}.avatar{background:#e7edf0;color:#203b4b;border:1px solid #d4dde1;border-radius:50%}

.content{max-width:1320px;padding:32px 44px 70px;margin:auto}

.institution-bar{display:flex;justify-content:space-between;gap:15px;border-top:2px solid #263e4c;border-bottom:1px solid #cbd3d8;padding:10px 0;margin:0 0 35px;color:#60717a;font-size:10px;font-weight:700;letter-spacing:.15em}

.head{border-bottom:1px solid #cbd4da;padding-bottom:22px;margin-bottom:25px}.head h1{font-family:Georgia,'Times New Roman',serif;font-weight:500;letter-spacing:-.035em;font-size:35px;color:#182c39}.head p{max-width:740px;color:#596b76;font-size:14px}

.kicker,.eyebrow,.sectionlabel{color:#536f7e;letter-spacing:.15em;font-size:10px;font-weight:700}

.card,.metric,.notice,.welcome,.demo,.mini{border-radius:0!important;box-shadow:none!important}

.card{border:1px solid #d8dfe4;padding:23px 25px;background:#fff}

.metrics{gap:0!important;border-top:1px solid #cfd8de;border-bottom:1px solid #cfd8de;margin-bottom:25px;background:white}

.metric{border:0!important;border-right:1px solid #d6dee3!important;background:#fff!important;padding:22px 24px!important}

.metric:last-child{border-right:0!important}.metric .number{font-family:Georgia,'Times New Roman',serif;font-size:35px;font-weight:500;letter-spacing:-.03em}

.btn{border-radius:0!important;box-shadow:none!important;font-weight:600;font-size:12px;letter-spacing:.01em;padding:10px 16px}.btn.primary{background:#213f51!important;border-color:#213f51!important;color:white!important}.btn:hover{filter:brightness(.95)}

input,textarea,select{border-radius:0!important;box-shadow:none!important;background:white!important}

.tablewrap{border-radius:0!important}table{border-collapse:collapse}th{background:#f0f3f5!important;color:#4b5f6c;font-size:10px;letter-spacing:.11em}td,th{border-bottom:1px solid #e0e5e9!important}tbody tr:hover{background:#f8fafb}

.tag,.pill{border-radius:0!important;font-size:10px;letter-spacing:.03em;font-weight:600}

.notice{background:#f3f5f6!important;border-left:3px solid #8c9ba4!important;color:#566774}

.footer{border-top:1px solid #d2dbe0;padding-top:17px;font-size:11px;color:#788893}

.login{background:#fff}.loginleft{background:#172e3e!important;color:#fff!important;position:relative;border-right:6px solid #ad956d;padding:65px clamp(30px,6vw,95px)!important;justify-content:space-between}

.loginleft:after{content:'ACADEMIC SERVICES   /   STUDENT EXPERIENCE   /   QUALITY ASSURANCE';position:absolute;bottom:65px;left:clamp(30px,6vw,95px);font-size:10px;letter-spacing:.18em;color:#b2c3cc;max-width:400px;line-height:1.8}

.loginleft h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.05em;font-size:clamp(42px,5vw,67px);line-height:1.12;margin:45px 0 20px}.loginleft p{font-size:15px;line-height:1.8;color:#cad5db;max-width:440px}.loginleft .sub{padding-bottom:70px;color:#9eb3bf;font-size:11px}

.loginright{background:#fff!important;padding:60px 45px!important}.loginbox{max-width:420px}.loginbox h2{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:400;margin:10px 0 8px}.loginbox>p{color:#667681}

.demo{border:1px solid #d7dfe4!important;background:#f6f8f9!important;padding:17px!important;margin-top:26px!important;font-size:12px}.demo b{letter-spacing:.04em;font-size:11px}

.login .field label{font-size:12px;color:#405563;font-weight:600}.login .field input{padding:13px!important}

@media(max-width:900px){.app{grid-template-columns:1fr}.side{padding:12px 14px;border-right:0;border-bottom:3px solid #a28b60;gap:12px}.side .brand{padding:0 6px}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap;padding:9px 13px}.content{padding:22px 17px 45px}.top{padding:0 17px}.institution-bar{flex-wrap:wrap}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric:nth-child(2){border-right:0!important}.login{grid-template-columns:1fr}.loginleft{min-height:310px;padding:35px 25px!important}.loginleft:after{display:none}.loginleft h1{font-size:39px;margin:25px 0 12px}.loginleft .sub{padding-bottom:0}.loginright{padding:38px 22px!important}}

@media(max-width:560px){.head h1{font-size:29px}.institution-bar{font-size:9px}.metric{padding:15px!important}.metric .number{font-size:29px}.card{padding:17px}.top .who{display:none}}

</style></head><body><div id="app"></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>

(()=>{'use strict';

const KEY='sfms-college-demo-v2';const sample={users:[{id:1,name:'Aarav Kumar',email:'student@demo.edu',role:'Student',active:true,department:'CSE (AI & ML)'},{id:2,name:'Dr. Priya Raman',email:'faculty@demo.edu',role:'Faculty',active:true,department:'CSE (AI & ML)'},{id:3,name:'Academic Administrator',email:'admin@demo.edu',role:'Admin',active:true,department:'Academic Office'},{id:4,name:'Meena S',email:'meena@demo.edu',role:'Student',active:true,department:'CSE (AI & ML)'}],subjects:[{id:1,code:'CS201',name:'Data Structures',faculty:'Dr. Priya Raman',active:true,semester:'III'},{id:2,code:'AI202',name:'Machine Learning Foundations',faculty:'Dr. Priya Raman',active:true,semester:'III'},{id:3,code:'CS203',name:'Operating Systems',faculty:'Dr. Priya Raman',active:true,semester:'III'}],cycles:[{id:1,name:'Semester III · Mid-semester review',status:'Open',end:'2026-11-15'}],feedback:[{id:1,studentId:4,subjectId:1,cycleId:1,rating:4,comment:'Clear explanations and useful practical examples.',date:'2026-10-04'}]};

const clone=x=>JSON.parse(JSON.stringify(x));let state=load(),user=null,page='overview',rating=0,studentLoading=false,studentError='',facultyLoading=false,facultyError='',facultyData=null,adminData=null,adminLoading=false,adminError='',adminBusy=false;function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.users&&s.subjects?s:clone(sample)}catch{return clone(sample)}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}function byId(id){return document.getElementById(id)}function subject(id){return state.subjects.find(s=>s.id===Number(id))}function currentCycle(){return state.cycles[0]||{id:0,name:'No active feedback cycle',status:'Closed',end:'—'}}function mine(){return state.feedback.filter(f=>f.studentId===user?.id)}function avg(fs){return fs.length?(fs.reduce((a,f)=>a+Number(f.rating),0)/fs.length).toFixed(1):'—'}function canSubmit(s){return !studentLoading&&!studentError&&s.active&&currentCycle().status==='Open'&&!mine().some(f=>f.subjectId===s.id&&f.cycleId===currentCycle().id)}function nav(){let n=[['overview','▦','Overview']];if(user.role==='Student')n.push(['submit','✎','Submit feedback'],['history','▤','Submission history']);if(user.role==='Faculty')n.push(['reports','▥','Feedback insights']);if(user.role==='Admin')n.push(['users','♙','User accounts'],['subjects','▣','Subjects & faculty'],['cycles','◷','Feedback cycles'],['reports','▥','Reporting overview']);return n}function heading(title,subtitle,action=''){return `<div class="head"><div><div class="kicker">Academic feedback / ${esc(user.role)} portal</div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`}function metric(label,value,detail){return `<div class="card metric"><div class="label">${label}</div><div class="number">${value}</div><div class="detail">${detail}</div></div>`}function cardtitle(s,right=''){return `<div class="cardtitle"><h2>${s}</h2>${right}</div>`}function shell(body){return `<div class="app"><aside class="side"><div class="brand"><div class="seal">CE</div><div><b>Course Evaluation<br>System</b><small>Academic Affairs · Evaluation Office</small></div></div><div><div class="navlabel">Workspace</div><nav class="nav" aria-label="Main navigation">${nav().map(([k,i,t])=>`<button data-page="${k}" class="${page===k?'active':''}"><span class="glyph">${i}</span>${t}</button>`).join('')}</nav></div><div class="sidefoot"><strong>BACKEND CONNECTED</strong>All roles use FastAPI and SQLite.</div></aside><main class="main"><header class="top"><div class="crumb">SFMS / <b>${esc(({overview:'Overview',submit:'Submit feedback',history:'Submission history',reports:'Feedback reports',users:'User accounts',subjects:'Subjects & faculty',cycles:'Feedback cycles'})[page]||'Overview')}</b></div><div class="identity"><div class="who"><strong>${esc(user.name)}</strong><small>${esc(user.role)} · ${esc(user.department||'')}</small></div><div class="avatar">${esc(user.name.slice(0,1))}</div><button class="btn small" data-action="logout">Sign out</button></div></header><div class="content"><div class="institution-bar"><span>ACADEMIC AFFAIRS</span><span>COURSE EVALUATION SYSTEM</span><span>AY 2026–27</span></div>${body}<div class="footer">Course Evaluation System · Authenticated local development · Live student, faculty, and administrator records</div></div></main></div>`}

function facultyOverview(){if(facultyLoading||facultyError||!facultyData)return heading('Faculty overview','Live, access-controlled reports for your assigned subjects.')+`<div class="card">${facultyLoading?'Loading faculty records…':`<strong>Unable to load faculty records</strong><p>${esc(facultyError||'No faculty data available.')}</p><button class="btn" data-action="retryfaculty">Retry connection</button>`}</div>`;const d=facultyData,s=d.summary,subjects=d.subjects,reports=d.reports;return heading('Faculty overview','Review feedback participation for your assigned subjects.')+`<div class="notice"><strong>Confidential reporting</strong> · Student identities and individual responses are never displayed. Rating statistics require at least ${esc(s.minimum_report_responses??d.minimum??3)} responses.</div><div class="grid metrics">${[metric('Assigned subjects',esc(s.assigned_subjects??subjects.length),'From academic database'),metric('Responses',esc(s.total_responses??0),'Across assigned subjects'),metric('Average rating',s.average_rating==null?'Suppressed':esc(Number(s.average_rating).toFixed(1))+'/5',s.privacy_suppressed?'Privacy threshold applies':'Aggregate of eligible responses'),metric('Subjects evaluated',esc(s.subjects_with_responses??reports.filter(r=>r.response_count>0).length),'With one or more responses')].join('')}</div><div class="grid twocol"><section class="card">${cardtitle('Assigned subjects',`<span class="chip info">${subjects.length} subjects</span>`)}${subjects.map(x=>`<div class="rowitem"><div><b>${esc(x.code)} · ${esc(x.name)}</b><small>${esc(x.faculty||user.email)}</small></div><span class="chip good">Assigned</span></div>`).join('')||'<div class="empty">No assigned subjects</div>'}</section><section class="card">${cardtitle('Response overview')}${reports.map(r=>`<div class="rowitem"><div><b>${esc(r.subject_code)} · ${esc(r.subject_name)}</b><small>${r.privacy_suppressed?'Ratings withheld for privacy':'Aggregate rating available'}</small></div><span class="chip ${r.response_count?'info':''}">${esc(r.response_count)} responses</span></div>`).join('')||'<div class="empty">No report data</div>'}<div class="actions"><button class="btn primary" data-page="reports">View detailed reports →</button></div></section></div>`}

function facultyReports(){if(facultyLoading||facultyError||!facultyData)return heading('Feedback insights','Live subject-level reports from the academic database.')+`<div class="card">${facultyLoading?'Loading faculty reports…':`<strong>Unable to load faculty reports</strong><p>${esc(facultyError||'No faculty data available.')}</p><button class="btn" data-action="retryfaculty">Retry connection</button>`}</div>`;const d=facultyData,s=d.summary,reports=d.reports,minimum=s.minimum_report_responses??d.minimum??3;return heading('Feedback insights','Aggregated course evaluations for your assigned subjects.',`<button class="btn" data-action="export">↓ Export summary CSV</button>`)+`<div class="notice"><strong>Privacy policy:</strong> Individual student identities and comments are not included. Subject ratings and distributions are suppressed below ${esc(minimum)} responses. Counts remain visible.</div><div class="grid metrics">${[metric('Responses',esc(s.total_responses??0),'Across assigned subjects'),metric('Average rating',s.average_rating==null?'Suppressed':esc(Number(s.average_rating).toFixed(1))+'/5',s.privacy_suppressed?'Minimum response threshold not met':'Aggregate rating'),metric('Subjects evaluated',esc(s.subjects_with_responses??0),'With one or more responses'),metric('Assigned subjects',esc(s.assigned_subjects??d.subjects.length),'Faculty-only access')].join('')}</div><div class="card">${cardtitle('Subject-level report',`<span class="chip info">${reports.length} subjects</span>`)}<div class="tablewrap"><table><thead><tr><th>Code</th><th>Subject</th><th>Responses</th><th>Average rating</th><th>Privacy status</th></tr></thead><tbody>${reports.map(r=>`<tr><td><b>${esc(r.subject_code)}</b></td><td>${esc(r.subject_name)}</td><td>${esc(r.response_count)}</td><td>${r.average_rating==null?'—':esc(Number(r.average_rating).toFixed(1))+'/5'}</td><td><span class="chip ${r.privacy_suppressed?'warn':'good'}">${r.privacy_suppressed?'Suppressed':'Available'}</span></td></tr>`) async function refreshFacultyData(){if(user?.role!=='Faculty')return;const accountId=user.id;facultyLoading=true;facultyError='';render();try{const [subjectsResult,summary,reportsResult]=await Promise.all([apiJSON('/api/faculty/subjects'),apiJSON('/api/faculty/summary'),apiJSON('/api/faculty/reports')]);if(user?.id!==accountId||user?.role!=='Faculty')return;const rawSubjects=Array.isArray(subjectsResult)?subjectsResult:subjectsResult.subjects??subjectsResult.assigned_subjects;const rawReports=Array.isArray(reportsResult)?reportsResult:reportsResult.reports;if(!Array.isArray(rawSubjects)||!Array.isArray(rawReports)||!summary||typeof summary!=='object')throw Error('Unexpected faculty API response format.');facultyData={subjects:rawSubjects.map(x=>({id:Number(x.subject_id??x.id),code:x.subject_code??x.code??'',name:x.subject_name??x.name??'',faculty:x.faculty_email??x.faculty??user.email})),summary,reports:rawReports,minimum:reportsResult.minimum_report_responses};facultyError=''}catch(err){if(user?.id!==accountId||user?.role!=='Faculty')return;facultyData=null;facultyError=err.status===401?'Session expired. Sign out and sign in again.':err.message||'Faculty API unavailable.'}finally{if(user?.id===accountId&&user?.role==='Faculty'){facultyLoading=false;render()}}}

function overview(){if(user.role==='Faculty')return facultyOverview();if(user.role==='Admin')return adminOverview();if(user.role==='Student'&&(studentLoading||studentError))return heading('Student overview','Your course records are loaded securely from the academic database.')+`<div class="card">${studentLoading?'Loading subjects and feedback…':`<strong>Unable to load student records</strong><p>${esc(studentError)}</p><button class="btn" data-action="retry">Retry connection</button>`}</div>`;const cycle=currentCycle(),student=user.role==='Student',faculty=user.role==='Faculty',isAdmin=user.role==='Admin',fs=student?mine():faculty?state.feedback.filter(f=>subject(f.subjectId)?.faculty===user.name):state.feedback;const active=state.subjects.filter(s=>s.active);let stats=student?[metric('Eligible subjects',active.length,'Semester III'),metric('Submitted',fs.length,'Current and prior cycles'),metric('Pending',active.filter(canSubmit).length,'Awaiting your feedback'),metric('Feedback cycle',cycle.status,'Closes '+cycle.end)]:faculty?[metric('Assigned subjects',active.filter(s=>s.faculty===user.name).length,'Current semester'),metric('Responses',fs.length,'Across assigned subjects'),metric('Average rating',avg(fs)+'/5','Aggregated feedback'),metric('Active cycle',cycle.status,'Mid-semester review')]:[metric('Registered users',state.users.length,'Student, faculty and admin'),metric('Active subjects',active.length,'Semester III'),metric('Responses',fs.length,'Across all subjects'),metric('Average rating',avg(fs)+'/5','All recorded feedback')];return heading(student?'Student overview':faculty?'Faculty overview':'Academic administration',student?'Review the active feedback cycle and track your submissions.':faculty?'Review feedback trends for your assigned subjects.':'Manage participation, academic records, and feedback cycles.')+`<div class="notice"><strong>${esc(cycle.name)}</strong> · ${esc(cycle.status)} for feedback · Scheduled closing date: ${esc(cycle.end)}. <span styl function submit(){if(studentLoading||studentError)return heading('Submit course feedback','Evaluations are submitted securely to the academic database.')+`<div class="card">${studentLoading?'Loading eligible subjects…':`<strong>Could not load eligible subjects</strong><p>${esc(studentError)}</p><button class="btn" data-action="retry">Retry connection</button>`}</div>`;const subjects=state.subjects.filter(canSubmit);return heading('Submit course feedback','Complete one evaluation per subject during the active feedback cycle.')+`<div class="notice"><strong>${esc(currentCycle().name)}</strong> · Open until ${esc(currentCycle().end)}. Ratings use a five-point scale.</div>${subjects.length?`<div class="card">${cardtitle('Course evaluation',`<span class="chip info">${subjects.length} pending</span>`)}<form id="feedbackForm"><div class="formgrid"><div class="field"><label for="subject">Course / subject *</label><select id="subject" required>${subjects.map(s=>`<option value="${s.id}">${esc(s.code)} — ${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label for="faculty">Assigned faculty</label><input id="faculty" readonly value="${esc(subjects[0].faculty)}"></div><div class="field full"><label>Overall teaching effectiveness *</label><div class="help">1 = Needs improvement · 3 = Satisfactory · 5 = Excellent</div><div class="rating" role="group" aria-label="Select rating">${[1,2,3,4,5].map(n=>`<button type="button" data-rating="${n}" aria-pressed="${rating===n}" class="${rating===n?'selected':''}">${n}</button>`).join('')}</div></div><div class="field full"><label for="comment">Additional comments (optional)</label><textarea id="comment" maxlength="600" placeholder="Share specific suggestions about teaching, course material, or learning support."></textarea><div class="help">Maximum 600 characters. Avoid personal or sensitive information.</div></div></div><div class="actions"><button type="submit" class="btn primary">Submit evaluation</button><button type=" function adminReports(){if(!adminReady())return adminLoadingCard('Reporting overview');const d=adminData;return heading('Reporting overview','Database-backed operational counts. Individual student responses and ratings are not exposed.',`<button class="btn" data-action="refreshadmin">↻ Refresh</button>`)+`<div class="notice"><strong>Privacy:</strong> The administrator summary API exposes aggregate counts only. Individual ratings, student identities, and comments are not included.</div><div class="grid metrics">${[metric('Total responses',esc(d.summary.total_responses),'Across all feedback cycles'),metric('Subjects',esc(d.summary.total_subjects),'All subjects'),metric('Feedback cycles',esc(d.summary.feedback_cycles),'Scheduled periods'),metric('Active accounts',esc(d.summary.active_users),'Across all roles')].join('')}</div><div class="card">${cardtitle('Subject directory')}<div class="tablewrap"><table><thead><tr><th>Code</th><th>Subject</th><th>Assigned faculty</th><th>Status</th></tr></thead><tbody>${d.subjects.map(s=>`<tr><td><b>${esc(s.code)}</b></td><td>${esc(s.name)}</td><td>${esc(s.faculty.map(f=>f.faculty_email).join(', ')||'Unassigned')}</td><td><span class="chip ${s.active?'good':'warn'}">${s.active?'Active':'Inactive'}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function users(){if(!adminReady())return adminLoadingCard('User accounts');const rows=adminData.users;return heading('User accounts','Create student, faculty, or administrator accounts and manage access.',`<button class="btn primary" data-action="adduser">+ Add user</button>`)+`<div class="card">${cardtitle('Account directory',`<span class="chip">${rows.length} users</span>`)}<div class="tablewrap"><table><thead><tr><th>ID</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u.id)}</td><td><b>${esc(u.email)}</b></td><td>${esc(u.role)}</td><td><span class="chip ${u.is_active?'good':'warn'}">${u.is_active?'Active':'Inactive'}</span></td><td><button class="btn small" data-toggleuser="${u.id}" ${u.id===user.id?'disabled title="You cannot deactivate your own account"':''}>${u.is_active?'Deactivate':'Activate'}</button></td></tr>`).join('')}</tbody></table></div><p class="help">Passwords are never displayed. Role changes are not enabled in this version.</p></div>`}

function cycles(){if(!adminReady())return adminLoadingCard('Feedback cycles');const rows=adminData.cycles,now=Date.now();return heading('Feedback cycles','Create and manage the evaluation periods used for student feedback.',`<button class="btn primary" data-action="addcycle">+ Add cycle</button>`)+`<div class="card">${cardtitle('Evaluation periods',`<span class="chip">${rows.length} cycles</span>`)}<div class="tablewrap"><table><thead><tr><th>Cycle</th><th>Starts (UTC)</th><th>Ends (UTC)</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(c=>{const start=Date.parse(c.starts_at),end=Date.parse(c.ends_at),status=now<start?'Upcoming':now>end?'Closed':'Open';return `<tr><td><b>${esc(c.name)}</b><br><small>#${esc(c.id)}</small></td><td>${esc(c.starts_at)}</td><td>${esc(c.ends_at)}</td><td><span class="chip ${status==='Open'?'good':status==='Upcoming'?'info':'warn'}">${status}</span></td><td><button class="btn small" data-editcycle="${c.id}">Edit</button></td></tr>`}).join('')}</tbody></table></div><p class="help">Cycle dates require a timezone offset. Cycles with submitted feedback cannot be edited.</p></div>`}
async function refreshAdminData(){if(user?.role!=='Admin')return;const accountId=user.id;adminLoading=true;adminError='';render();try{const [summary,userRows,subjectRows,cycleRows]=await Promise.all([apiJSON('/api/admin/summary'),apiJSON('/api/admin/users'),apiJSON('/api/admin/subjects'),apiJSON('/api/admin/cycles')]);if(user?.id!==accountId||user?.role!=='Admin')return;if(!Array.isArray(userRows.users)||!Array.isArray(subjectRows.subjects)||!Array.isArray(cycleRows.cycles))throw Error('Unexpected administrator API response.');adminData={summary,users:userRows.users,subjects:subjectRows.subjects,cycles:cycleRows.cycles};adminError=''}catch(err){if(user?.id!==accountId||user?.role!=='Admin')return;adminData=null;adminError=err.status===401?'Session expired. Sign out and sign in again.':err.message||'Administrator API unavailable.'}finally{if(user?.id===accountId&&user?.role==='Admin'){adminLoading=false;render()}}}
async function adminWrite(path,method,payload,success){if(user?.role!=='Admin'||adminBusy)return;adminBusy=true;try{await apiJSON(path,{method,headers:payload===undefined?{}:{'Content-Type':'application/json'},...(payload===undefined?{}:{body:JSON.stringify(payload)})});await refreshAdminData();notify(success)}catch(err){notify(`Request failed: ${err.message}`)}finally{adminBusy=false}}
function adminAction(act,id){if(!adminReady()||adminBusy)return;const d=adminData;if(act==='adduser'){const email=prompt('Institutional email for the new user');if(email===null||!email.trim())return;const role=prompt('Role: student, faculty, or admin','student');if(role===null)return;if(!['student','faculty','admin'].includes(role.trim().toLowerCase())){notify('Choose student, faculty, or admin.');return}const password=prompt('Initial password (at least 12 characters)');if(password===null)return;if(password.length<12){notify('Password must have at least 12 characters.');return}void adminWrite('/api/admin/users','POST',{email:email.trim(),role:role.trim().toLowerCase(),password},'Account created.');return}
if(act==='addsubject'){const code=prompt('New subject code (for example SFMS107)');if(code===null||!code.trim())return;const name=prompt('Subject name');if(name===null||!name.trim())return;void adminWrite('/api/admin/subjects','POST',{code:code.trim(),name:name.trim()},'Subject created.');return}
if(act==='addcycle'){const name=prompt('Feedback cycle name');if(name===null||!name.trim())return;const starts_at=prompt('Start date and time with timezone (ISO 8601)','2026-11-01T00:00:00+05:30');if(starts_at===null)return;const ends_at=prompt('End date and time with timezone (ISO 8601)','2026-11-30T23:59:59+05:30');if(ends_at===null)return;void adminWrite('/api/admin/cycles','POST',{name:name.trim(),starts_at:starts_at.trim(),ends_at:ends_at.trim()},'Feedback cycle created.');return}
if(act==='toggleuser'){const u=d.users.find(x=>x.id===id);if(!u||u.id===user.id)return;const next=!u.is_active;if(!confirm(`${next?'Activate':'Deactivate'} ${u.email}?`))return;void adminWrite(`/api/admin/users/${id}/status`,'PATCH',{is_active:next},'Account status updated.');return}
if(act==='togglesubject'){const s=d.subjects.find(x=>x.id===id);if(!s)return;const next=!s.active;if(!confirm(`${next?'Activate':'Deactivate'} ${s.code}?`))return;void adminWrite(`/api/admin/subjects/${id}/status`,'PATCH',{active:next},'Subject status updated.');return}
if(act==='editsubject'){const s=d.subjects.find(x=>x.id===id);if(!s)return;const code=prompt('Subject code',s.code);if(code===null)return;const name=prompt('Subject name',s.name);if(name===null)return;void adminWrite(`/api/admin/subjects/${id}`,'PATCH',{code:code.trim(),name:name.trim()},'Subject updated.');return}
if(act==='assignsubject'){const s=d.subjects.find(x=>x.id===id);if(!s)return;const eligible=d.users.filter(x=>x.role==='faculty'&&x.is_active);if(!eligible.length){notify('Create an active faculty account first.');return}const choices=eligible.map(x=>`${x.id}: ${x.email}`).join('\n');const facultyId=prompt(`Enter faculty ID to assign to ${s.code}:\n${choices}`,String(eligible[0].id));if(facultyId===null)return;const faculty_id=Number(facultyId);if(!eligible.some(x=>x.id===faculty_id)){notify('Select a valid active faculty ID.');return}void adminWrite('/api/admin/assignments','POST',{subject_id:id,faculty_id},'Faculty assigned.');return}
if(act==='removeassignment'){if(!confirm('Remove this faculty assignment? Assignments with feedback history cannot be removed.'))return;void adminWrite(`/api/admin/assignments/${id}`,'DELETE',undefined,'Faculty assignment removed.');return}
if(act==='editcycle'){const c=d.cycles.find(x=>x.id===id);if(!c)return;const name=prompt('Feedback cycle name',c.name);if(name===null)return;const starts_at=prompt('Start date and time (ISO 8601 with timezone)',c.starts_at);if(starts_at===null)return;const ends_at=prompt('End date and time (ISO 8601 with timezone)',c.ends_at);if(ends_at===null)return;void adminWrite(`/api/admin/cycles/${id}`,'PATCH',{name:name.trim(),starts_at:starts_at.trim(),ends_at:ends_at.trim()},'Feedback cycle updated.');return}}


function login(){byId('app').innerHTML=`<div class="login"><div class="loginleft"><div class="brand" style="padding:0"><div class="seal">CE</div><div><b>Course Evaluation System</b><small>Academic Affairs · Evaluation Office</small></div></div><div><div class="kicker" style="color:#83d7ce">COURSE EVALUATION / ACADEMIC YEAR 2026–27</div><h1>Course evaluations,<br>handled with care.</h1><p>An academic record of course experience, designed for students, teaching staff, and programme coordinators.</p></div><div class="sub">College project · FastAPI authentication · SQLite academic records</div></div><div class="loginright"><form class="loginbox" id="loginForm"><div class="kicker">ACCOUNT ACCESS</div><h2>Sign in</h2><p>Sign in using an account created in the local FastAPI database.</p><div class="field"><label for="email">Institutional email</label><input id="email" type="email" autocomplete="username" required placeholder="your-email@example.edu"></div><div class="field" style="margin-top:16px"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your account password"></div><div class="actions"><button class="btn primary" style="width:100%" type="submit">Sign in to portal →</button></div><div class="demo"><b>Local backend account</b><div style="margin-top:8px">Create accounts by running <code>create_demo_user.py</code> inside the backend folder. Your credentials are checked by FastAPI.</div></div><p class="help" style="margin-top:16px">Login uses your local FastAPI server and an HTTP-only session cookie. Account access and academic records are managed in SQLite.</p></form></div></div>`}

function render(){if(!user){login();return}if(!nav().some(n=>n[0]===page))page='overview';const body=({overview,submit,history,reports,users,subjects,cycles})[page]();byId('app').innerHTML=shell(body)}async function signIn(email,password){try{const res=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email,password})});if(!res.ok){notify(res.status===401?'Incorrect email or password.':'Login failed ('+res.status+').');return}const account=await res.json();setAuthenticatedUser(account);notify('Signed in as '+user.role)}catch(err){notify('Cannot reach backend. Open the application at http\://127.0.0.1:8000/')}}function setAuthenticatedUser(account){const role=account.role.charAt(0).toUpperCase()+account.role.slice(1);user={id:account.id,email:account.email,name:account.email.split('@')[0],role,active:true,department:'Local development'};page='overview';if(role==='Faculty'){facultyData=null;facultyLoading=true;facultyError='';render();void refreshFacultyData()}else if(role==='Student'){state.subjects=[];state.cycles=[];state.feedback=[];studentLoading=true;studentError='';render();void refreshStudentData()}else if(role==='Admin'){adminData=null;adminLoading=true;adminError='';render();void refreshAdminData()}else{render()}} 

function normalizeFeedback(row){const subjectId=Number(row.subject_id??row.subjectId??row.subject?.id);const facultyId=Number(row.faculty_id??row.facultyId??row.faculty?.id);const cycleId=Number(row.cycle_id??row.cycleId??row.cycle?.id);return {id:row.id,studentId:Number(row.student_id??row.studentId??user.id),subjectId,facultyId,cycleId,rating:Number(row.rating),comment:row.comment||'',date:String(row.created_at??row.submitted_at??row.date??'—').slice(0,10)}}

async function apiJSON(path,options={}){const r=await fetch(path,{credentials:'same-origin',...options});let data;try{data=await r.json()}catch{data={}}if(!r.ok){const detail=typeof data.detail==='string'?data.detail:JSON.stringify(data.detail||data);const err=new Error(detail||`HTTP ${r.status}`);err.status=r.status;throw err}return data}

async function refreshStudentData(){if(user?.role!=='Student')return;const accountId=user.id;studentLoading=true;studentError='';render();try{const [catalog,history]=await Promise.all([apiJSON('/api/subjects'),apiJSON('/api/feedback/mine')]);if(user?.id!==accountId)return;const subjects=Array.isArray(catalog)?catalog:catalog.subjects;const cycles=catalog.active_cycles??catalog.cycles??[];const records=Array.isArray(history)?history:(history.feedback??history.submissions??history.items??history.feedback_submissions);if(!Array.isArray(subjects)||!Array.isArray(cycles)||!Array.isArray(records))throw Error('Unexpected API response structure. Check the API response in Swagger.');state.subjects=subjects.map(s=>({id:Number(s.id),code:s.code,name:s.name,faculty:s.faculty_email||s.faculty_name||'Assigned faculty',facultyId:Number(s.faculty_id),active:s.active!==false,semester:'—'}));state.cycles=cycles.map(c=>({id:Number(c.id),name:c.name,status:'Open',end:String(c.ends_at??c.end??'—').slice(0,10)}));state.feedback=records.map(normalizeFeedback);studentError=''}catch(err){if(user?.id!==accountId)return;studentError=err.status===401?'Session expired. Please sign out and sign in again.':err.message||'Could not connect to the API.';state.subjects=[];state.cycles=[];state.feedback=[]}finally{if(user?.id===accountId){studentLoading=false;render()}}}

async function restoreSession(){try{const r=await fetch('/auth/me',{credentials:'same-origin'});if(r.ok)setAuthenticatedUser(await r.json());else render()}catch{render()}}function exportCSV(){if(user?.role==='Faculty'){if(!facultyData||facultyLoading||facultyError){notify('Faculty reports are not ready.');return}const rows=[['Subject code','Subject','Responses','Average rating','Privacy status'],...facultyData.reports.map(r=>[r.subject_code,r.subject_name,r.response_count,r.average_rating==null?'Suppressed':Number(r.average_rating).toFixed(1),r.privacy_suppressed?'Suppressed':'Available'])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='sfms-faculty-report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}const assigned=user.role==='Faculty'?state.subjects.filter(s=>s.faculty===user.name):state.subjects;const rows=[['Subject code','Subject','Faculty','Responses','Average rating'],...assigned.map(s=>{const f=state.feedback.filter(x=>x.subjectId===s.id);return [s.code,s.name,s.faculty,f.length,avg(f)]})];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.href=url;a.download='sfms-aggregate-report-demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();void signIn(byId('email').value.trim().toLowerCase(),byId('password').value);return}if(e.target.id==='feedbackForm'){e.preventDefault();if(user?.role!=='Student'){notify('Student access required.');return}if(studentLoading||studentError){notify('Student records are not ready.');return}const id=Number(byId('subject').value),comment=byId('comment').value.trim(),s=subject(id),cycle=currentCycle();if(!s||!canSubmit(s)){notify('This subject is not eligible for feedback.');return}if(!Number.isInteger(rating)||rating<1||rating>5){notify('Select a rating from 1 to 5.');return}const button=e.target.querySelector('[type=submit]');button.disabled=true;button.textContent='Submitting…';const payload={subject_id:id,faculty_id:s.facultyId,cycle_id:cycle.id,rating,comment};void (async()=>{try{await apiJSON('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});rating=0;page='history';await refreshStudentData();notify(studentError?'Feedback accepted; refresh history to confirm.':'Evaluation saved successfully. Thank you for your feedback.')}catch(err){notify(err.status===409?'This evaluation was already submitted.':`Could not submit feedback: ${err.message}`);button.disabled=false;button.textContent='Submit evaluation'}})()}});

document.addEventListener('click',e=>{const navButton=e.target.closest('[data-page]');if(navButton){const target=navButton.dataset.page;if(nav().some(n=>n[0]===target)){page=target;rating=0;render()}return}const rb=e.target.closest('[data-rating]');if(rb){rating=Number(rb.dataset.rating);document.querySelectorAll('[data-rating]').forEach(b=>{b.classList.toggle('selected',Number(b.dataset.rating)===rating);b.setAttribute('aria-pressed',String(Number(b.dataset.rating)===rating))});return}const act=e.target.closest('[data-action]')?.dataset.action;if(act==='logout'){void fetch('/auth/logout',{method:'POST',credentials:'same-origin'}).finally(()=>{user=null;studentLoading=false;studentError='';state=load();adminData=null;adminError='';adminLoading=false;facultyData=null;page='overview';render()});return}if(act==='retry'&&user?.role==='Student'){void refreshStudentData();return}if(act==='retryfaculty'&&user?.role==='Faculty'){void refreshFacultyData();return}if(act==='switch-disabled'){const opts=[['student@demo.edu','student123'],['faculty@demo.edu','faculty123'],['admin@demo.edu','admin123']];const idx=opts.findIndex(x=>x[0]===byId('email').value);const next=opts[(idx+1)%opts.length];byId('email').value=next[0];byId('password').value=next[1];return}if(act==='export'&&user?.role==='Faculty'){exportCSV();return}if(user?.role==='Admin'&&['adduser','addsubject','addcycle'].includes(act)){adminAction(act);return}if(user?.role==='Admin'&&(act==='retryadmin'||act==='refreshadmin')){void refreshAdminData();return}for(const [attr,kind] of [['data-toggleuser','toggleuser'],['data-togglesubject','togglesubject'],['data-editsubject','editsubject'],['data-assignsubject','assignsubject'],['data-removeassignment','removeassignment'],['data-editcycle','editcycle']]){const el=e.target.closest('['+attr+']');if(el&&user?.role==='Admin'){adminAction(kind,Number(el.getAttribute(attr)));return}}});document.addEventListener('change',e=>{if(e.target.id==='subject'){byId('faculty').value=subject(e.target.value)?.faculty||''}});document.addEventListener('reset',e=>{if(e.target.id==='feedbackForm'){rating=0;setTimeout(render,0)}});restoreSession();})();

</script></body></html>
