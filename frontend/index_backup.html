/* Institutional redesign — deliberately flat, document-led and restrained. */
:root{--ink:#172431;--navy:#132838;--teal:#284c5b;--teal-soft:#edf1f3;--bg:#f8f9fa;--line:#d4dbe0;--muted:#61717c;--white:#fff;--amber:#856221;--red:#9a3e3e;--radius:0}
body{background:#f8f9fa;color:var(--ink);font:14px/1.55 'Segoe UI',Arial,sans-serif}
.app{grid-template-columns:232px minmax(0,1fr)}

.seal{height:38px;width:38px;border:1px solid #b6a47f;border-radius:0;font-size:15px;letter-spacing:.02em;color:#e9ddc4}

.brand small{font-size:10px;letter-spacing:.01em;line-height:1.4;color:#b8c8cf}

.nav{gap:0}.nav button{width:100%;border:0;border-left:3px solid transparent;border-radius:0;background:transparent;color:#d0dce3;padding:13px 20px;font-size:13px;font-weight:500;text-align:left;transition:background .12s}

.nav .glyph{opacity:.72}.sidefoot{margin:0 20px;padding:16px 0;border:0;border-top:1px solid #48606d;border-radius:0;background:transparent;color:#a9bcc7;font-size:11px}.sidefoot strong{font-size:10px;letter-spacing:.12em;color:#e6d6b8}
.top{height:66px;background:#fff;border-bottom:1px solid var(--line);padding:0 42px}
.crumb{font-size:12px;color:#667783}.crumb b{color:#172b3a;font-weight:600}.avatar{background:#e7edf0;color:#203b4b;border:1px solid #d4dde1;border-radius:50%}
.content{max-width:1320px;padding:32px 44px 70px;margin:auto}

.head{border-bottom:1px solid #cbd4da;padding-bottom:22px;margin-bottom:25px}.head h1{font-family:Georgia,'Times New Roman',serif;font-weight:500;letter-spacing:-.035em;font-size:35px;color:#182c39}.head p{max-width:740px;color:#596b76;font-size:14px}

.card{border:1px solid #d8dfe4;padding:23px 25px;background:#fff}
.metrics{gap:0!important;border-top:1px solid #cfd8de;border-bottom:1px solid #cfd8de;margin-bottom:25px;background:white}

.metric:last-child{border-right:0!important}.metric .number{font-family:Georgia,'Times New Roman',serif;font-size:35px;font-weight:500;letter-spacing:-.03em}

.loginright{background:#fff!important;padding:60px 45px!important}.loginbox{max-width:420px}.loginbox h2{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:400;margin:10px 0 8px}.loginbox>p{color:#667681}

.login .field label{font-size:12px;color:#405563;font-weight:600}.login .field input{padding:13px!important}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{padding:12px 14px;border-right:0;border-bottom:3px solid #a28b60;gap:12px}.side .brand{padding:0 6px}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap;padding:9px 13px}.content{padding:22px 17px 45px}.top{padding:0 17px}.institution-bar{flex-wrap:wrap}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric:nth-child(2){border-right:0!important}.login{grid-template-columns:1fr}.loginleft{min-height:310px;padding:35px 25px!important}.loginleft:after{display:none}.loginleft h1{font-size:39px;margin:25px 0 12px}.loginleft .sub{padding-bottom:0}.loginright{padding:38px 22px!important}}
@media(max-width:560px){.head h1{font-size:29px}.institution-bar{font-size:9px}.metric{padding:15px!important}.metric .number{font-size:29px}.card{padding:17px}.top .who{display:none}}
</style></head><body><div id="app"></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
(()=>{'use strict';
const KEY='sfms-college-demo-v2';const sample={users:[{id:1,name:'Aarav Kumar',email:'student@demo.edu',role:'Student',active:true,department:'CSE (AI & ML)'},{id:2,name:'Dr. Priya Raman',email:'faculty@demo.edu',role:'Faculty',active:true,department:'CSE (AI & ML)'},{id:3,name:'Academic Administrator',email:'admin@demo.edu',role:'Admin',active:true,department:'Academic Office'},{id:4,name:'Meena S',email:'meena@demo.edu',role:'Student',active:true,department:'CSE (AI & ML)'}],subjects:[{id:1,code:'CS201',name:'Data Structures',faculty:'Dr. Priya Raman',active:true,semester:'III'},{id:2,code:'AI202',name:'Machine Learning Foundations',faculty:'Dr. Priya Raman',active:true,semester:'III'},{id:3,code:'CS203',name:'Operating Systems',faculty:'Dr. Priya Raman',active:true,semester:'III'}],cycles:[{id:1,name:'Semester III · Mid-semester review',status:'Open',end:'2026-11-15'}],feedback:[{id:1,studentId:4,subjectId:1,cycleId:1,rating:4,comment:'Clear explanations and useful practical examples.',date:'2026-10-04'}]};
const clone=x=>JSON.parse(JSON.stringify(x));let state=load(),user=null,page='overview',rating=0;function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.users&&s.subjects?s:clone(sample)}catch{return clone(sample)}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}function byId(id){return document.getElementById(id)}function subject(id){return state.subjects.find(s=>s.id===Number(id))}function currentCycle(){return state.cycles[0]}function mine(){return state.feedback.filter(f=>f.studentId===user.id)}function avg(fs){return fs.length?(fs.reduce((a,f)=>a+Number(f.rating),0)/fs.length).toFixed(1):'—'}function canSubmit(s){return s.active&&currentCycle().status==='Open'&&!mine().some(f=>f.subjectId===s.id&&f.cycleId===currentCycle().id)}function nav(){let n=[['overview','▦','Overview']];if(user.role==='Student')n.push(['submit','✎','Submit feedback'],['history','▤','Submission history']);if(user.role==='Faculty')n.push(['reports','▥','Feedback insights']);if(user.role==='Admin')n.push(['users','♙','User accounts'],['subjects','▣','Subjects & faculty'],['reports','▥','Feedback reports']);return n}function heading(title,subtitle,action=''){return `<div class="head"><div><div class="kicker">Academic feedback / ${esc(user.role)} portal</div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`}function metric(label,value,detail){return `<div class="card metric"><div class="label">${label}</div><div class="number">${value}</div><div class="detail">${detail}</div></div>`}function cardtitle(s,right=''){return `<div class="cardtitle"><h2>${s}</h2>${right}</div>`}function shell(body){return `<div class="app"><aside class="side"><div class="brand"><div class="seal">CE</div><div><b>Course Evaluation<br>System</b><small>Academic Affairs · Evaluation Office</small></div></div><div><div class="navlabel">Workspace</div><nav class="nav" aria-label="Main navigation">${nav().map(([k,i,t])=>`<button data-page="${k}" class="${page===k?'active':''}"><span class="glyph">${i}</span>${t}</button>`).join('')}</nav></div><div class="sidefoot"><strong>BACKEND AUTHENTICATION ACTIVE</strong>Login is verified by FastAPI. Subjects, evaluations and reports remain browser-only demonstrations.</div></aside><main class="main"><header class="top"><div class="crumb">SFMS / <b>${esc(({overview:'Overview',submit:'Submit feedback',history:'Submission history',reports:'Feedback reports',users:'User accounts',subjects:'Subjects & faculty'})[page]||'Overview')}</b></div><div class="identity"><div class="who"><strong>${esc(user.name)}</strong><small>${esc(user.role)} · ${esc(user.department||'')}</small></div><div class="avatar">${esc(user.name.slice(0,1))}</div><button class="btn small" data-action="logout">Sign out</button></div></header><div class="content"><div class="institution-bar"><span>ACADEMIC AFFAIRS</span><span>COURSE EVALUATION SYSTEM</span><span>AY 2026–27</span></div>${body}<div class="footer">Course Evaluation System · Authenticated local development · Academic records are demonstration data</div></div></main></div>`}
function overview(){const cycle=currentCycle(),student=user.role==='Student',faculty=user.role==='Faculty',isAdmin=user.role==='Admin',fs=student?mine():faculty?state.feedback.filter(f=>subject(f.subjectId)?.faculty===user.name):state.feedback;const active=state.subjects.filter(s=>s.active);let stats=student?[metric('Eligible subjects',active.length,'Semester III'),metric('Submitted',fs.length,'Current and prior cycles'),metric('Pending',active.filter(canSubmit).length,'Awaiting your feedback'),metric('Feedback cycle',cycle.status,'Closes '+cycle.end)]:faculty?[metric('Assigned subjects',active.filter(s=>s.faculty===user.name).length,'Current semester'),metric('Responses',fs.length,'Across assigned subjects'),metric('Average rating',avg(fs)+'/5','Aggregated feedback'),metric('Active cycle',cycle.status,'Mid-semester review')]:[metric('Registered users',state.users.length,'Student, faculty and admin'),metric('Active subjects',active.length,'Semester III'),metric('Responses',fs.length,'Across all subjects'),metric('Average rating',avg(fs)+'/5','All recorded feedback')];return heading(student?'Student overview':faculty?'Faculty overview':'Academic administration',student?'Review the active feedback cycle and track your submissions.':faculty?'Review feedback trends for your assigned subjects.':'Manage participation, academic records, and feedback cycles.')+`<div class="notice"><strong>${esc(cycle.name)}</strong> · ${esc(cycle.status)} for feedback · Scheduled closing date: ${esc(cycle.end)}. <span style="font-size:12px">Demonstration academic records.</span></div><div class="grid metrics">${stats.join('')}</div><div class="grid twocol"><section class="card">${cardtitle(student?'My subjects':faculty?'Assigned subjects':'Subject overview',`<span class="chip info">Semester III</span>`)}${active.map(s=>`<div class="rowitem"><div><b>${esc(s.code)} · ${esc(s.name)}</b><small>${esc(s.faculty)} · Semester ${esc(s.semester)}</small></div>${student?`<span class="chip ${canSubmit(s)?'warn':'good'}">${canSubmit(s)?'Pending':'Submitted'}</span>`:`<span class="chip good">Active</span>`}</div>`).join('')||'<div class="empty">No active subjects</div>'}</section><section class="card">${cardtitle('Quick access')}<div class="rowitem"><div><b>${student?'Submit course feedback':faculty?'View feedback insights':'Manage subject records'}</b><small>${student?'Complete pending evaluations':faculty?'Aggregated subject performance':'Update academic offerings'}</small></div><button class="btn small" data-page="${student?'submit':faculty?'reports':'subjects'}">Open →</button></div><div class="rowitem"><div><b>${student?'Submission history':faculty?'Feedback reports':'User management'}</b><small>${student?'Track completed responses':faculty?'Review summary statistics':'Manage demo user access'}</small></div><button class="btn small" data-page="${student?'history':faculty?'reports':'users'}">Open →</button></div><div class="notice" style="margin:16px 0 0"><strong>Privacy note</strong><br>Production reports must enforce faculty scope and anonymity on the server.</div></section></div>`}
function submit(){const subjects=state.subjects.filter(canSubmit);return heading('Submit course feedback','Complete one evaluation per subject during the active feedback cycle.')+`<div class="notice"><strong>${esc(currentCycle().name)}</strong> · Open until ${esc(currentCycle().end)}. Ratings use a five-point scale.</div>${subjects.length?`<div class="card">${cardtitle('Course evaluation',`<span class="chip info">${subjects.length} pending</span>`)}<form id="feedbackForm"><div class="formgrid"><div class="field"><label for="subject">Course / subject *</label><select id="subject" required>${subjects.map(s=>`<option value="${s.id}">${esc(s.code)} — ${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label for="faculty">Assigned faculty</label><input id="faculty" readonly value="${esc(subjects[0].faculty)}"></div><div class="field full"><label>Overall teaching effectiveness *</label><div class="help">1 = Needs improvement · 3 = Satisfactory · 5 = Excellent</div><div class="rating" role="group" aria-label="Select rating">${[1,2,3,4,5].map(n=>`<button type="button" data-rating="${n}" aria-pressed="${rating===n}" class="${rating===n?'selected':''}">${n}</button>`).join('')}</div></div><div class="field full"><label for="comment">Additional comments (optional)</label><textarea id="comment" maxlength="600" placeholder="Share specific suggestions about teaching, course material, or learning support."></textarea><div class="help">Maximum 600 characters. Avoid personal or sensitive information.</div></div></div><div class="actions"><button type="submit" class="btn primary">Submit evaluation</button><button type="reset" class="btn">Clear form</button></div></form></div>`:`<div class="card empty"><strong>No evaluations pending</strong>You have completed all available evaluations for this cycle, or the cycle is closed.<div class="actions" style="justify-content:center"><button class="btn" data-page="history">View history</button></div></div>`}`}
function history(){const fs=mine();return heading('Submission history','Review your completed course evaluations.')+`<div class="card">${cardtitle('My evaluations',`<span class="chip">${fs.length} records</span>`)}${fs.length?`<div class="tablewrap"><table><thead><tr><th>Subject</th><th>Faculty</th><th>Rating</th><th>Submitted</th><th>Status</th></tr></thead><tbody>${fs.map(f=>`<tr><td><b>${esc(subject(f.subjectId)?.code||'—')}</b><br>${esc(subject(f.subjectId)?.name||'Archived subject')}</td><td>${esc(subject(f.subjectId)?.faculty||'—')}</td><td>${f.rating}/5</td><td>${esc(f.date)}</td><td><span class="chip good">Received</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><strong>No submissions yet</strong>Your completed evaluations will appear here.</div>'}</div>`}
function reports(){const assigned=user.role==='Faculty'?state.subjects.filter(s=>s.faculty===user.name):state.subjects;const fs=state.feedback.filter(f=>assigned.some(s=>s.id===f.subjectId));return heading('Feedback insights','Aggregated course evaluations for the selected academic cycle.',`<button class="btn" data-action="export">↓ Export summary CSV</button>`)+`<div class="notice"><strong>Reporting policy:</strong> Individual student identities are not displayed here. Production reports should suppress small groups and apply server-side access controls.</div><div class="grid metrics">${[metric('Responses',fs.length,'Across accessible subjects'),metric('Average score',avg(fs)+'/5','Five-point scale'),metric('Subjects evaluated',new Set(fs.map(f=>f.subjectId)).size,'With one or more responses'),metric('Active cycle',currentCycle().status,'Semester III')].join('')}</div><div class="grid twocol"><section class="card">${cardtitle('Average rating by subject')}${assigned.map(s=>{const x=fs.filter(f=>f.subjectId===s.id);const a=x.length?Number(avg(x)):0;return `<div class="chartrow"><span>${esc(s.code)} · ${esc(s.name)}</span><div class="bar"><span style="width:${a/5*100}%"></span></div><b>${x.length?a.toFixed(1):'—'}</b></div>`}).join('')}</section><section class="card">${cardtitle('Response distribution')}${[5,4,3,2,1].map(n=>{const c=fs.filter(f=>f.rating===n).length;return `<div class="chartrow"><span>${n} star${n===1?'':'s'}</span><div class="bar"><span style="width:${fs.length?c/fs.length*100:0}%"></span></div><b>${c}</b></div>`}).join('')}</section></div><div class="card" style="margin-top:16px">${cardtitle('Course-level summary')}<div class="tablewrap"><table><thead><tr><th>Code</th><th>Subject</th><th>Faculty</th><th>Responses</th><th>Average rating</th></tr></thead><tbody>${assigned.map(s=>{const x=fs.filter(f=>f.subjectId===s.id);return `<tr><td><b>${esc(s.code)}</b></td><td>${esc(s.name)}</td><td>${esc(s.faculty)}</td><td>${x.length}</td><td>${avg(x)}${x.length?'/5':''}</td></tr>`}).join('')}</tbody></table></div></div>`}
function users(){return heading('User accounts','Manage student, faculty, and administrator demo records.',`<button class="btn primary" data-action="adduser">+ Add user</button>`)+`<div class="card">${cardtitle('Account directory',`<span class="chip">${state.users.length} users</span>`)}<div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.users.map(u=>`<tr><td><b>${esc(u.name)}</b><br><span class="help">${esc(u.department||'')}</span></td><td>${esc(u.email)}</td><td><select aria-label="Role for ${esc(u.name)}" data-userrole="${u.id}">${['Student','Faculty','Admin'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></td><td><span class="chip ${u.active?'good':'warn'}">${u.active?'Active':'Inactive'}</span></td><td><button class="btn small" data-toggleuser="${u.id}">${u.active?'Deactivate':'Activate'}</button></td></tr>`).join('')}</tbody></table></div><p class="help">Demo controls only. Real role changes require authenticated admin APIs and audit logs.</p></div>`}
function subjects(){return heading('Subjects & faculty','Maintain academic subjects and faculty assignments for the feedback cycle.',`<button class="btn primary" data-action="addsubject">+ Add subject</button>`)+`<div class="card">${cardtitle('Semester III subjects',`<span class="chip">${state.subjects.length} subjects</span>`)}<div class="tablewrap"><table><thead><tr><th>Code</th><th>Subject</th><th>Faculty</th><th>Semester</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.subjects.map(s=>`<tr><td><b>${esc(s.code)}</b></td><td>${esc(s.name)}</td><td>${esc(s.faculty)}</td><td>${esc(s.semester)}</td><td><span class="chip ${s.active?'good':'warn'}">${s.active?'Active':'Inactive'}</span></td><td><button class="btn small" data-togglesubject="${s.id}">${s.active?'Deactivate':'Activate'}</button></td></tr>`).join('')}</tbody></table></div></div>`}
function login(){byId('app').innerHTML=`<div class="login"><div class="loginleft"><div class="brand" style="padding:0"><div class="seal">CE</div><div><b>Course Evaluation System</b><small>Academic Affairs · Evaluation Office</small></div></div><div><div class="kicker" style="color:#83d7ce">COURSE EVALUATION / ACADEMIC YEAR 2026–27</div><h1>Course evaluations,<br>handled with care.</h1><p>An academic record of course experience, designed for students, teaching staff, and programme coordinators.</p></div><div class="sub">College project · Local authentication backend · Demo academic records</div></div><div class="loginright"><form class="loginbox" id="loginForm"><div class="kicker">ACCOUNT ACCESS</div><h2>Sign in</h2><p>Sign in using an account created in the local FastAPI database.</p><div class="field"><label for="email">Institutional email</label><input id="email" type="email" autocomplete="username" required placeholder="your-email@example.edu"></div><div class="field" style="margin-top:16px"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your account password"></div><div class="actions"><button class="btn primary" style="width:100%" type="submit">Sign in to portal →</button></div><div class="demo"><b>Local backend account</b><div style="margin-top:8px">Create accounts by running <code>create_demo_user.py</code> inside the backend folder. Your credentials are checked by FastAPI.</div></div><p class="help" style="margin-top:16px">Login uses your local FastAPI server and an HTTP-only session cookie. All course and feedback data on subsequent screens remains demonstration-only.</p></form></div></div>`}
function render(){if(!user){login();return}if(!nav().some(n=>n[0]===page))page='overview';const body=({overview,submit,history,reports,users,subjects})[page]();byId('app').innerHTML=shell(body)}async function signIn(email,password){try{const res=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email,password})});if(!res.ok){notify(res.status===401?'Incorrect email or password.':'Login failed ('+res.status+').');return}const account=await res.json();setAuthenticatedUser(account);notify('Signed in as '+user.role)}catch(err){notify('Cannot reach backend. Open the application at http://127.0.0.1:8000/')}}function setAuthenticatedUser(account){const role=account.role.charAt(0).toUpperCase()+account.role.slice(1);user={id:account.id,email:account.email,name:account.email.split('@')[0],role,active:true,department:'Local development'};page='overview';render()}async function restoreSession(){try{const r=await fetch('/auth/me',{credentials:'same-origin'});if(r.ok)setAuthenticatedUser(await r.json());else render()}catch{render()}}function exportCSV(){const assigned=user.role==='Faculty'?state.subjects.filter(s=>s.faculty===user.name):state.subjects;const rows=[['Subject code','Subject','Faculty','Responses','Average rating'],...assigned.map(s=>{const f=state.feedback.filter(x=>x.subjectId===s.id);return [s.code,s.name,s.faculty,f.length,avg(f)]})];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.href=url;a.download='sfms-aggregate-report-demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();void signIn(byId('email').value.trim().toLowerCase(),byId('password').value);return}if(e.target.id==='feedbackForm'){e.preventDefault();if(user?.role!=='Student'){notify('Student access required.');return}const id=Number(byId('subject').value),comment=byId('comment').value.trim(),s=subject(id);if(!s||!canSubmit(s)){notify('This subject is not eligible for feedback.');return}if(!Number.isInteger(rating)||rating<1||rating>5){notify('Select a rating from 1 to 5.');return}state.feedback.push({id:Date.now(),studentId:user.id,subjectId:id,cycleId:currentCycle().id,rating,comment,date:new Date().toISOString().slice(0,10)});save();rating=0;page='history';render();notify('Evaluation received. Thank you for your feedback.')}});
document.addEventListener('click',e=>{const navButton=e.target.closest('[data-page]');if(navButton){const target=navButton.dataset.page;if(nav().some(n=>n[0]===target)){page=target;rating=0;render()}return}const rb=e.target.closest('[data-rating]');if(rb){rating=Number(rb.dataset.rating);document.querySelectorAll('[data-rating]').forEach(b=>{b.classList.toggle('selected',Number(b.dataset.rating)===rating);b.setAttribute('aria-pressed',String(Number(b.dataset.rating)===rating))});return}const act=e.target.closest('[data-action]')?.dataset.action;if(act==='logout'){void fetch('/auth/logout',{method:'POST',credentials:'same-origin'}).finally(()=>{user=null;page='overview';render()});return}if(act==='switch-disabled'){const opts=[['student@demo.edu','student123'],['faculty@demo.edu','faculty123'],['admin@demo.edu','admin123']];const idx=opts.findIndex(x=>x[0]===byId('email').value);const next=opts[(idx+1)%opts.length];byId('email').value=next[0];byId('password').value=next[1];return}if(act==='export'&&user?.role!=='Student'){exportCSV();return}if(act==='adduser'&&user?.role==='Admin'){const name=prompt('Full name');if(!name?.trim())return;const email=prompt('Institutional email');if(!email?.trim()||!/^\S+@\S+\.\S+$/.test(email.trim())||state.users.some(u=>u.email===email.trim().toLowerCase())){notify('Enter a unique valid email.');return}const role=prompt('Role (Student, Faculty, Admin)','Student');if(!['Student','Faculty','Admin'].includes(role)){notify('Invalid role.');return}state.users.push({id:Date.now(),name:name.trim(),email:email.trim().toLowerCase(),role,active:true,department:'CSE (AI & ML)'});save();render();notify('Demo account created. Note: no login credentials were provisioned.');return}if(act==='addsubject'&&user?.role==='Admin'){const code=prompt('Subject code');if(!code?.trim())return;if(state.subjects.some(s=>s.code.toLowerCase()===code.trim().toLowerCase())){notify('Subject code already exists.');return}const name=prompt('Subject name');if(!name?.trim())return;const faculty=prompt('Assigned faculty name','Dr. Priya Raman');if(!faculty?.trim())return;state.subjects.push({id:Date.now(),code:code.trim(),name:name.trim(),faculty:faculty.trim(),semester:'III',active:true});save();render();notify('Subject added to demo records.');return}const ub=e.target.closest('[data-toggleuser]');if(ub&&user?.role==='Admin'){const u=state.users.find(x=>x.id===Number(ub.dataset.toggleuser));if(u){if(u.id===user.id){notify('You cannot deactivate your own demo account.');return}u.active=!u.active;save();render()}return}const sb=e.target.closest('[data-togglesubject]');if(sb&&user?.role==='Admin'){const s=subject(sb.dataset.togglesubject);if(s){s.active=!s.active;save();render()}return}});
document.addEventListener('change',e=>{if(e.target.id==='subject'){byId('faculty').value=subject(e.target.value)?.faculty||''}const role=e.target.closest('[data-userrole]');if(role&&user?.role==='Admin'){const u=state.users.find(x=>x.id===Number(role.dataset.userrole));if(u){if(u.id===user.id){notify('Cannot change your own demo role.');render();return}u.role=role.value;save();notify('Demo role updated.')}}});document.addEventListener('reset',e=>{if(e.target.id==='feedbackForm'){rating=0;setTimeout(render,0)}});restoreSession();})();
</script></body></html>
